<rect x="0" y="0" width="1040" height="640" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Level 2 · Containers inside Pyp</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">One Next.js codebase on Render (website, dashboard, API) plus a Chrome extension; background jobs via Inngest or a Postgres job table; Postgres is the source of truth.</text><rect x="170" y="74" width="700" height="540" rx="14" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="7 5"/><text x="184" y="94" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">PYP (Render web service + Postgres + cron)</text><circle cx="80" cy="118" r="13" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M56,156 Q56,134 80,134 Q104,134 104,156 Z" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6"/><text x="80" y="176" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant</text><text x="80" y="193" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">browser</text><rect x="16" y="236" width="140" height="76" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="86" y="262.8625" font-size="13.5" font-weight="650" fill="#1e3a8a" text-anchor="middle">Chrome extension</text><text x="86" y="282.5375" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="middle">side panel next to</text>
<text x="86" y="298.0625" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="middle">PayPal; no PayPal keys</text><rect x="16" y="420" width="140" height="70" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="86" y="451.7875" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal</text><text x="86" y="471.6375" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="middle">webhooks · REST writes</text><rect x="894" y="110" width="130" height="84" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="959" y="148.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal</text><text x="959" y="169.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">MCP read tools</text><rect x="894" y="300" width="130" height="76" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="959" y="334.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">Claude API</text><text x="959" y="355.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">or Ollama (dev)</text><rect x="196" y="104" width="200" height="44" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="296" y="122.9625" font-size="13.5" font-weight="650" fill="#1e3a8a" text-anchor="middle">Website</text><text x="296" y="141.9875" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">public landing page</text><rect x="196" y="160" width="200" height="76" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="296" y="186" font-size="15" font-weight="650" fill="#1e3a8a" text-anchor="middle">Dashboard</text><text x="296" y="207.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">inbox + trace, Activity,</text>
<text x="296" y="224.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">setup, Pyp widget + chat</text><rect x="430" y="110" width="200" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="530" y="140" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">App API</text><text x="530" y="161.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">cards, approve / undo, rules,</text>
