<text x="759" y="322.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Claude · Ollama · scripted</text>
<text x="759" y="339.8125" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">spend cap, timeouts</text><rect x="430" y="400" width="200" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="530" y="430" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Queue functions</text><text x="530" y="451.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">runSkill, execute, sweeps,</text>
<text x="530" y="468.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">reconcile, undo timers</text><rect x="664" y="400" width="190" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="759" y="430" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><text x="759" y="451.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">only PayPal write path;</text>
