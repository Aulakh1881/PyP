<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Policy engine decision order">
<title>Policy engine decision order</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Policy engine · how one proposal gets its decision</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">Plain code, evaluated top to bottom; the first rule that fires wins. The model cannot see or change any of this.</text><rect x="40" y="84" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="108.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Kill switch on?</text><path d="M300,124 L300,134" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,104 L620,104 L620,120 L698,120" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#ahr)"/><text x="574" y="99" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="136" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="160.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Dial for this command = Off?</text><path d="M300,176 L300,186" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,156 L626,156 L626,120 L698,120" fill="none" stroke="#b91c1c" stroke-width="1.3" marker-end="url(#ahr)"/><text x="574" y="151" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="188" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="212.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Hard cap: command is "never Auto"?</text><path d="M300,228 L300,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,208 L632,208 L632,260 L698,260" fill="none" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#ahb)"/><text x="574" y="203" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="240" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="264.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Over a limit? (amount, per-day count, per-client cooldown)</text><path d="M300,280 L300,290" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,260 L638,260 L638,260 L698,260" fill="none" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#ahb)"/><text x="574" y="255" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="292" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="316.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Model confidence low, or it asked a question?</text><path d="M300,332 L300,342" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,312 L644,312 L644,260 L698,260" fill="none" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#ahb)"/><text x="574" y="307" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="344" width="520" height="40" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="368.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="start">Dial = Ask me?</text><path d="M300,384 L300,394" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M560,364 L650,364 L650,260 L698,260" fill="none" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#ahb)"/><text x="574" y="359" font-size="11" font-weight="400" fill="#5b6478" text-anchor="start">yes</text><rect x="40" y="396" width="520" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="54" y="420.3875" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="start">Dial = Auto</text><path d="M560,416 L656,416 L656,400 L698,400" fill="none" stroke="#0f766e" stroke-width="1.3" marker-end="url(#aht)"/><rect x="700" y="90" width="300" height="62" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="850" y="117.4375" font-size="15" font-weight="650" fill="#7f1d1d" text-anchor="middle">BLOCK</text><text x="850" y="138.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">logged; card says why (no action taken)</text><rect x="700" y="228" width="300" height="62" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="850" y="255.4375" font-size="15" font-weight="650" fill="#1e3a8a" text-anchor="middle">ASK ME</text><text x="850" y="276.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">card in inbox; Approve / Edit / Dismiss</text><rect x="700" y="368" width="300" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="850" y="395.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">AUTO</text><text x="850" y="416.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">scheduled after undo window, then executed</text><text x="40" y="452" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start" font-style="italic">Every decision is stored with the rule that fired (policy_rule) so the card can say "Asked you because: offers always need your approval".</text>
</svg>