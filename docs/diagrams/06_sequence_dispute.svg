<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Sequence · Disputes skill answers a new dispute</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">High stakes, so evidence submission is capped at "Ask me". Buyer text is quarantined before the main call sees it.</text><rect x="29.42857142857143" y="80" width="124" height="40" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/><text x="91.42857142857143" y="104.225" font-size="13" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal</text><line x1="91.42857142857143" y1="120" x2="91.42857142857143" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="172.28571428571428" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="234.28571428571428" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Webhook intake</text><line x1="234.28571428571428" y1="120" x2="234.28571428571428" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="315.14285714285717" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="377.14285714285717" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Agent engine</text><line x1="377.14285714285717" y1="120" x2="377.14285714285717" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="458" y="80" width="124" height="40" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="520" y="104.225" font-size="13" font-weight="650" fill="#4c1d95" text-anchor="middle">Haiku 5.5</text><line x1="520" y1="120" x2="520" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="600.8571428571429" y="80" width="124" height="40" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="662.8571428571429" y="104.225" font-size="13" font-weight="650" fill="#4c1d95" text-anchor="middle">Opus 5.5</text><line x1="662.8571428571429" y1="120" x2="662.8571428571429" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="743.7142857142858" y="80" width="124" height="40" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="805.7142857142858" y="104.225" font-size="13" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant</text><line x1="805.7142857142858" y1="120" x2="805.7142857142858" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="886.5714285714286" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="948.5714285714286" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><line x1="948.5714285714286" y1="120" x2="948.5714285714286" y2="670" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M91.42857142857143,156 L231.28571428571428,156" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="162.85714285714286" y="149" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">CUSTOMER.DISPUTE.CREATED</text><path d="M234.28571428571428,190 h40 v18 h-38" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="282.2857142857143" y="203" font-size="12" font-weight="400" fill="#1b2135" text-anchor="start">verify signature, dedupe, store, 200 OK</text><path d="M234.28571428571428,240 L374.14285714285717,240" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="305.7142857142857" y="233" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">runSkill(disputes)</text><path d="M377.14285714285717,274 L94.42857142857143,274" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="234.2857142857143" y="267" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">GET dispute, capture, order, tracking</text><path d="M377.14285714285717,308 L517,308" fill="none" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ahv)"/><text x="448.57142857142856" y="301" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">buyer messages only</text><path d="M520,342 L380.14285714285717,342" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahv)"/><text x="448.57142857142856" y="335" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">facts: claim, ask, tone</text><path d="M377.14285714285717,376 L659.8571428571429,376" fill="none" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ahv)"/><text x="520" y="369" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">case file + facts + allowed commands</text><path d="M662.8571428571429,410 L380.14285714285717,410" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahv)"/><text x="520" y="403" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">dispute.provideEvidence + draft note</text><path d="M377.14285714285717,444 h40 v18 h-38" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="425.14285714285717" y="457" font-size="12" font-weight="400" fill="#1b2135" text-anchor="start">every claim cites a fetched record?</text><path d="M377.14285714285717,494 L802.7142857142858,494" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ahb)"/><text x="591.4285714285714" y="487" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">Ask me → card with evidence + deadline</text><rect x="317.14285714285717" y="514" width="548.5714285714287" height="28" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/><text x="591.4285714285714" y="530" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">Minutes or days later. Nothing is held in memory; the proposal waits in Postgres.</text><path d="M805.7142857142858,572 L945.5714285714286,572" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ahb)"/><text x="877.1428571428571" y="565" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">Approve (maybe after editing)</text><path d="M948.5714285714286,606 L94.42857142857143,606" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="520" y="599" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">re-check: still open? then provide-evidence</text><path d="M948.5714285714286,640 L808.7142857142858,640" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ahb)"/><text x="877.1428571428571" y="633" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">card: "Submitted"</text>
