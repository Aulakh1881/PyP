<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Pyp trust boundaries">
<title>Pyp trust boundaries</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Trust boundaries</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">Text from buyers is untrusted. The model is treated as untrusted output. Secrets live only on the right-hand side.</text><rect x="20" y="80" width="300" height="360" rx="14" fill="#fffafa" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="100" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">UNTRUSTED INPUT</text><rect x="350" y="80" width="320" height="360" rx="14" fill="#fcfaff" stroke="#6d28d9" stroke-width="1.4" stroke-dasharray="7 5"/><text x="364" y="100" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="start">MODEL ZONE (no secrets, no tools that write)</text><rect x="700" y="80" width="320" height="360" rx="14" fill="#f8fdfc" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="7 5"/><text x="714" y="100" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">TRUSTED CODE (holds keys)</text><rect x="40" y="116" width="260" height="62" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="170" y="143.4375" font-size="15" font-weight="650" fill="#7f1d1d" text-anchor="middle">Buyer messages</text><text x="170" y="164.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">dispute text, invoice notes</text><rect x="40" y="206" width="260" height="62" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="170" y="233.4375" font-size="15" font-weight="650" fill="#7f1d1d" text-anchor="middle">Merchant chat text</text><text x="170" y="254.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">trusted user, but can paste anything</text><rect x="40" y="296" width="260" height="62" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="170" y="323.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal data</text><text x="170" y="344.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">trusted source, free-text fields</text><rect x="370" y="116" width="280" height="70" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="510" y="139" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">Quarantine call (Haiku)</text><text x="510" y="160.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">reads buyer text only;</text>
<text x="510" y="177.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">no commands; returns facts</text><rect x="370" y="226" width="280" height="84" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="510" y="247.5625" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">Main skill call</text><text x="510" y="269.0625" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">sees case file + facts;</text>
<text x="510" y="285.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">untrusted text wrapped &amp; escaped;</text>
<text x="510" y="302.8125" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">can only emit enum'd commands</text><rect x="370" y="344" width="280" height="62" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="510" y="371.4375" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">Chat loop</text><text x="510" y="392.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">read-only tools; writes = proposals</text><rect x="720" y="116" width="280" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="860" y="143.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Validator + policy</text><text x="860" y="164.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">re-fetch via MCP read client, decide</text><rect x="720" y="206" width="280" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="860" y="233.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><text x="860" y="254.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">the only PayPal write path</text><rect x="720" y="296" width="280" height="62" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="1.6" filter="url(#sh)"/><text x="860" y="315" font-size="15" font-weight="650" fill="#7c2d12" text-anchor="middle">Secrets</text><text x="860" y="336.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Render env vars + extension token hash;</text>
<text x="860" y="353.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">never sent to the model</text><rect x="720" y="380" width="280" height="46" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="1.6" filter="url(#sh)"/><text x="860" y="399.625" font-size="13.5" font-weight="650" fill="#7c2d12" text-anchor="middle">Logs</text><text x="860" y="419.3" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="middle">redacted: no keys, no full PII</text><path d="M300,147 L368,147" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ahr)"/><path d="M300,237 L340,237 L340,260 L368,260" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ahr)"/><path d="M300,327 L340,327 L340,285 L368,285" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M510,186 L510,224" fill="none" stroke="#6d28d9" stroke-width="1.6" marker-end="url(#ahv)"/><path d="M650,268 L685,268 L685,147 L718,147" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><text x="370" y="428" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start" font-style="italic">Output leaves this zone only as proposal data.</text><path d="M650,375 L685,375 L685,160" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M860,178 L860,204" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M860,296 L860,270" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>