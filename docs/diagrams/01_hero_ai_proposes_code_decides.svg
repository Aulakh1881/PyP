<rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Pyp: the AI proposes, code decides</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">Every skill run follows the same path. The model never touches PayPal; only the executor holds write credentials.</text><rect x="20" y="82" width="150" height="300" rx="14" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="102" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">TRIGGERS</text><rect x="34" y="116" width="122" height="62" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/><text x="95" y="143.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal event</text><text x="95" y="164.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">signed webhook</text><rect x="34" y="200" width="122" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="95" y="227.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Scheduler</text><text x="95" y="248.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">daily sweeps</text><rect x="34" y="284" width="122" height="62" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="95" y="311.4375" font-size="15" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant</text><text x="95" y="332.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">chat request</text><rect x="200" y="196" width="140" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><rect x="208" y="187" width="65.2" height="18" rx="9" fill="#0f766e"/><text x="240.6" y="200" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">1 GATHER</text><text x="270" y="231" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Case file</text><text x="270" y="252.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">code fetches facts</text>
<text x="270" y="269.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">XML with stable ids</text><rect x="370" y="196" width="140" height="84" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><rect x="378" y="187" width="71.6" height="18" rx="9" fill="#6d28d9"/><text x="413.8" y="200" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">2 PROPOSE</text><text x="440" y="231" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">Pyp model</text><text x="440" y="252.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">one structured call</text>
<text x="440" y="269.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">→ summary + actions</text><rect x="540" y="196" width="140" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><rect x="548" y="187" width="58.800000000000004" height="18" rx="9" fill="#0f766e"/><text x="577.4" y="200" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">3 CHECK</text><text x="610" y="231" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Validator</text><text x="610" y="252.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">schema + live state</text>
<text x="610" y="269.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">resolve exact values</text><rect x="710" y="196" width="140" height="84" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><rect x="718" y="187" width="65.2" height="18" rx="9" fill="#0f766e"/><text x="750.6" y="200" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">4 DECIDE</text><text x="780" y="231" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Policy dial</text><text x="780" y="252.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Off / Ask me / Auto</text>
<text x="780" y="269.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">+ limits, caps</text><path d="M156,147 L178,147 L178,238 L198,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M156,231 L178,231 L178,238 L198,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M156,315 L178,315 L178,238 L198,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M340,238 L368,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M510,238 L538,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M680,238 L708,238" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="880" y="92" width="140" height="62" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="950" y="119.4375" font-size="15" font-weight="650" fill="#7f1d1d" text-anchor="middle">Block</text><text x="950" y="140.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">logged with reason</text><rect x="880" y="207" width="140" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="950" y="234.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Auto</text><text x="950" y="255.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">run after undo window</text><rect x="880" y="322" width="140" height="62" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="950" y="349.4375" font-size="15" font-weight="650" fill="#1e3a8a" text-anchor="middle">Ask me</text><text x="950" y="370.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">card waits in inbox</text><path d="M850,220 L864,220 L864,123 L878,123" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#ahr)"/><path d="M850,238 L878,238" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aht)"/><path d="M850,256 L864,256 L864,353 L878,353" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ahb)"/><rect x="710" y="420" width="140" height="60" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><rect x="718" y="411" width="46" height="18" rx="9" fill="#0f766e"/><text x="741" y="424" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">5 ACT</text><text x="780" y="451.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><text x="780" y="472.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">idempotent write</text><rect x="540" y="420" width="140" height="60" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="610" y="446.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal REST</text><text x="610" y="467.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">sandbox</text><path d="M1020,238 L1030,238 L1030,450 L852,450" fill="none" stroke="#0f766e" stroke-width="1.6" marker-end="url(#aht)"/><path d="M950,384 L950,436 L852,436" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ahb)"/><rect x="824.76" y="398" width="124.24000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="944" y="410" font-size="12" font-weight="400" fill="#5b6478" text-anchor="end">merchant approves</text><path d="M708,450 L682,450" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="200" y="420" width="310" height="60" rx="10" fill="#fff4e5" stroke="#b45309" stroke-width="1.6" filter="url(#sh)"/><text x="355" y="446.4375" font-size="15" font-weight="650" fill="#7c2d12" text-anchor="middle">Activity log + decision trace</text><text x="355" y="467.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">every step timestamped → the back of each card</text><path d="M440,282 L440,418" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M610,282 L610,300 L470,300 L470,418" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="200" y="150" width="14" height="14" rx="3" fill="#f3edff" stroke="#6d28d9" stroke-width="1.5"/><text x="220" y="161" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">AI model call</text><rect x="315.9" y="150" width="14" height="14" rx="3" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.5"/><text x="335.9" y="161" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Deterministic code</text><rect x="463.29999999999995" y="150" width="14" height="14" rx="3" fill="#fff4e5" stroke="#b45309" stroke-width="1.5"/><text x="483.29999999999995" y="161" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Stored state</text><rect x="572.9" y="150" width="14" height="14" rx="3" fill="#eef1f5" stroke="#475569" stroke-width="1.5"/><text x="592.9" y="161" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Outside system</text><rect x="695.1" y="150" width="14" height="14" rx="3" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.5"/><text x="715.1" y="161" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Merchant / UI</text>
