<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" height="590" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="C4 level 1 system context for Pyp">
<title>C4 level 1 system context for Pyp</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="590" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Level 1 · System context</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">Who and what Pyp talks to. Dashed = outside our control. Faded = designed, built only if time allows.</text><circle cx="130" cy="148" r="13" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6"/>
<path d="M106,186 Q106,164 130,164 Q154,164 154,186 Z" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6"/><text x="130" y="206" font-size="14" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant</text><text x="130" y="223" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">owner of a PayPal business account</text><rect x="400" y="200" width="240" height="130" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="520" y="245.82500000000002" font-size="22" font-weight="650" fill="#134e4a" text-anchor="middle">Pyp</text><text x="520" y="270.425" font-size="13" font-weight="400" fill="#5b6478" text-anchor="middle">watches the business,</text>
<text x="520" y="287.975" font-size="13" font-weight="400" fill="#5b6478" text-anchor="middle">proposes and takes actions</text>
<text x="520" y="305.52500000000003" font-size="13" font-weight="400" fill="#5b6478" text-anchor="middle">within the merchant's rules</text><rect x="760" y="110" width="240" height="92" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="880" y="144" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal REST APIs</text><text x="880" y="165.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Invoicing v2 · Disputes v1</text>
<text x="880" y="182.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Payments v2 · Reporting · Orders</text><rect x="760" y="236" width="240" height="70" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="880" y="267.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal Webhooks</text><text x="880" y="288.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">signed events → Pyp</text><rect x="760" y="340" width="240" height="80" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="880" y="368" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">Anthropic Claude API</text><text x="880" y="389.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Haiku / Sonnet / Opus 5.5</text>
<text x="880" y="406.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">(Ollama on laptops in dev)</text><circle cx="130" cy="398" r="13" fill="#eef1f5" stroke="#475569" stroke-width="1.6"/>
<path d="M106,436 Q106,414 130,414 Q154,414 154,436 Z" fill="#eef1f5" stroke="#475569" stroke-width="1.6"/><text x="130" y="456" font-size="14" font-weight="650" fill="#1e293b" text-anchor="middle">Buyers / clients</text><text x="130" y="473" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">reached only through PayPal</text><g opacity="0.55"><rect x="400" y="430" width="240" height="72" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="520" y="454" font-size="15" font-weight="650" fill="#1b2135" text-anchor="middle">Other AI apps (MCP)</text><text x="520" y="475.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">Claude Desktop, ChatGPT…</text>
<text x="520" y="492.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">ask Pyp, still rule-checked</text></g><g opacity="0.55"><rect x="400" y="82" width="240" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="520" y="110.4375" font-size="15" font-weight="650" fill="#1b2135" text-anchor="middle">Outside MCP sources</text><text x="520" y="131.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">shipping, storefront data</text></g><path d="M200,160 L398,240" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="224.44" y="160" width="151.12" height="35.2" rx="4" fill="#ffffff" opacity="0.92"/><text x="300" y="172" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">approves, sets rules,</text>
<text x="300" y="187.6" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">chats, reviews cards</text><path d="M640,230 L758,160" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="637.96" y="164" width="104.08000000000001" height="35.2" rx="4" fill="#ffffff" opacity="0.92"/><text x="690" y="176" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">reads state,</text>
<text x="690" y="191.6" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">writes actions</text><path d="M758,271 L642,271" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="674.84" y="251" width="50.32000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="700" y="263" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">events</text><path d="M640,300 L758,370" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="644.68" y="340" width="90.64000000000001" height="35.2" rx="4" fill="#ffffff" opacity="0.92"/><text x="690" y="352" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">case files →</text>
<text x="690" y="367.6" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">← proposals</text><path d="M880,202 L880,234" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1000,156 L1024,156 L1024,530 L130,530 L130,500" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="339.96" y="512" width="440.08000000000004" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="560" y="524" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">reminders, dispute replies, refunds (sent by PayPal, not by Pyp)</text><g opacity="0.55"><path d="M520,428 L520,332" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><path d="M520,148 L520,198" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/></g><rect x="24" y="564" width="14" height="14" rx="3" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.5"/><text x="44" y="575" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Deterministic code</text><rect x="171.39999999999998" y="564" width="14" height="14" rx="3" fill="#eef1f5" stroke="#475569" stroke-width="1.5"/><text x="191.39999999999998" y="575" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Outside system</text><rect x="293.59999999999997" y="564" width="14" height="14" rx="3" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.5"/><text x="313.59999999999997" y="575" font-size="11.5" font-weight="400" fill="#5b6478" text-anchor="start">Merchant / UI</text>
</svg>