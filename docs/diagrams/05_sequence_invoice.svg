<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Sequence · Collections skill chases an overdue invoice</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">The hero flow. No PayPal webhook exists for "overdue", so the scheduler sweep finds it. Reminders are set to Auto by this merchant.</text><rect x="29.42857142857143" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="91.42857142857143" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Scheduler</text><line x1="91.42857142857143" y1="120" x2="91.42857142857143" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="172.28571428571428" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="234.28571428571428" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Agent engine</text><line x1="234.28571428571428" y1="120" x2="234.28571428571428" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="315.14285714285717" y="80" width="124" height="40" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/><text x="377.14285714285717" y="104.225" font-size="13" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal API</text><line x1="377.14285714285717" y1="120" x2="377.14285714285717" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="458" y="80" width="124" height="40" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="520" y="104.225" font-size="13" font-weight="650" fill="#4c1d95" text-anchor="middle">Claude</text><line x1="520" y1="120" x2="520" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="600.8571428571429" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="662.8571428571429" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Policy</text><line x1="662.8571428571429" y1="120" x2="662.8571428571429" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="743.7142857142858" y="80" width="124" height="40" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="805.7142857142858" y="104.225" font-size="13" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><line x1="805.7142857142858" y1="120" x2="805.7142857142858" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><rect x="886.5714285714286" y="80" width="124" height="40" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="948.5714285714286" y="104.225" font-size="13" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant</text><line x1="948.5714285714286" y1="120" x2="948.5714285714286" y2="660" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M91.42857142857143,156 L231.28571428571428,156" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="162.85714285714286" y="149" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">sweep: invoices past due</text><text x="24" y="160" font-size="10.5" font-weight="400" fill="#5b6478" text-anchor="start">08:00:00</text><path d="M234.28571428571428,190 L374.14285714285717,190" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="305.7142857142857" y="183" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">search UNPAID / past due</text><path d="M377.14285714285717,224 L237.28571428571428,224" fill="none" stroke="#7b8496" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="305.7142857142857" y="217" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">INV-0042 · $1,200 · 7 days</text><path d="M234.28571428571428,258 h40 v18 h-38" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="282.2857142857143" y="271" font-size="12" font-weight="400" fill="#1b2135" text-anchor="start">build case file: history, past reminders, rules</text><path d="M234.28571428571428,308 L517,308" fill="none" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ahv)"/><text x="377.1428571428571" y="301" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">case file + allowed commands</text><text x="24" y="312" font-size="10.5" font-weight="400" fill="#5b6478" text-anchor="start">08:00:02</text><path d="M520,342 L237.28571428571428,342" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahv)"/><text x="377.1428571428571" y="335" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">invoice.sendReminder(friendly)</text><text x="24" y="346" font-size="10.5" font-weight="400" fill="#5b6478" text-anchor="start">08:00:05</text><path d="M234.28571428571428,376 h40 v18 h-38" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="282.2857142857143" y="389" font-size="12" font-weight="400" fill="#1b2135" text-anchor="start">validate: still UNPAID? not reminded in 3 days?</text><path d="M234.28571428571428,426 L659.8571428571429,426" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="448.57142857142856" y="419" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">proposal</text><path d="M662.8571428571429,460 L945.5714285714286,460" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ahb)"/><text x="805.7142857142858" y="453" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">Auto → card "Sending in 60 s · Undo"</text><rect x="460" y="480" width="548.5714285714286" height="28" rx="7" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.2"/><text x="734.2857142857142" y="496" font-size="12" font-weight="400" fill="#1e3a8a" text-anchor="middle">Undo window: the merchant can cancel for 60 s. Nothing has left Pyp yet.</text><path d="M662.8571428571429,538 L802.7142857142858,538" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="734.2857142857143" y="531" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">execute (window passed)</text><text x="24" y="542" font-size="10.5" font-weight="400" fill="#5b6478" text-anchor="start">09:01:06</text><path d="M805.7142857142858,572 L380.14285714285717,572" fill="none" stroke="#7b8496" stroke-width="1.5" marker-end="url(#ah)"/><text x="591.4285714285714" y="565" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">POST /remind  (PayPal-Request-Id)</text><path d="M377.14285714285717,606 L802.7142857142858,606" fill="none" stroke="#7b8496" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="591.4285714285714" y="599" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">204 No Content</text><path d="M805.7142857142858,640 L945.5714285714286,640" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ahb)"/><text x="877.1428571428571" y="633" font-size="12" font-weight="400" fill="#1b2135" text-anchor="middle">card: "Sent"</text>
</svg>