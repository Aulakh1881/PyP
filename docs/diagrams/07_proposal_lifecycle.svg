<rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Proposal lifecycle</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">One state machine for every action of every skill. Transitions are written by code only; each one is a row in the decision trace.</text><rect x="570" y="110" width="128" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="634" y="137.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="middle">rejected</text><rect x="740" y="110" width="160" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="820" y="137.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="middle">expired / obsolete</text><rect x="360" y="190" width="150" height="46" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="435" y="217.3875" font-size="13.5" font-weight="650" fill="#1e3a8a" text-anchor="middle">awaiting_approval</text><rect x="20" y="270" width="128" height="46" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="84" y="297.3875" font-size="13.5" font-weight="650" fill="#4c1d95" text-anchor="middle">proposed</text><rect x="190" y="270" width="128" height="46" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="254" y="297.3875" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="middle">validated</text><rect x="570" y="270" width="128" height="46" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="634" y="297.3875" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="middle">executing</text><rect x="740" y="270" width="128" height="46" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="804" y="297.3875" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="middle">executed</text><rect x="900" y="270" width="120" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/><text x="960" y="297.3875" font-size="13.5" font-weight="650" fill="#1b2135" text-anchor="middle">undone</text><rect x="360" y="350" width="150" height="46" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="435" y="377.3875" font-size="13.5" font-weight="650" fill="#134e4a" text-anchor="middle">scheduled</text><rect x="20" y="380" width="128" height="46" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="84" y="407.3875" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">invalid</text><rect x="190" y="380" width="128" height="46" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="254" y="407.3875" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">blocked</text><rect x="570" y="380" width="128" height="46" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" filter="url(#sh)"/><text x="634" y="407.3875" font-size="13.5" font-weight="650" fill="#7f1d1d" text-anchor="middle">failed</text><path d="M148,293 L188,293" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M318,285 L340,285 L340,213 L358,213" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="288.68" y="234" width="50.32000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="334" y="246" font-size="12" font-weight="400" fill="#5b6478" text-anchor="end">Ask me</text><path d="M318,301 L340,301 L340,373 L358,373" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="302.12" y="312" width="36.88" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="334" y="324" font-size="12" font-weight="400" fill="#5b6478" text-anchor="end">Auto</text><path d="M84,316 L84,378" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="87" y="340" width="83.92" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="92" y="352" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">check fails</text><path d="M254,316 L254,378" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="257" y="350" width="130.96" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="262" y="362" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">policy: Off / kill</text><path d="M510,205 L540,205 L540,285 L568,285" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="481.96" y="234" width="57.040000000000006" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="534" y="246" font-size="12" font-weight="400" fill="#5b6478" text-anchor="end">approve</text><path d="M510,373 L540,373 L540,301 L568,301" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="421.48" y="322" width="117.52000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="534" y="334" font-size="12" font-weight="400" fill="#5b6478" text-anchor="end">undo window ends</text><path d="M470,190 L470,133 L568,133" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="494.84" y="114" width="50.32000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="520" y="126" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">reject</text><path d="M420,190 L420,88 L820,88 L820,108" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="507.48" y="70" width="225.04000000000002" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="620" y="82" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">timeout, or PayPal state changed</text><path d="M435,396 L435,446 L960,446 L960,318" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="694.52" y="428" width="130.96" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="760" y="440" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">merchant taps Undo</text><path d="M698,293 L738,293" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M634,316 L634,378" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="637" y="340" width="90.64000000000001" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="642" y="352" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">PayPal error</text><path d="M868,293 L898,293" fill="none" stroke="#7b8496" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="832.8" y="251" width="102.4" height="18.3" rx="4" fill="#ffffff" opacity="0.92"/><text x="884" y="262" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">reversible only</text>
</svg>