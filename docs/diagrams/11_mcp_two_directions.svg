<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" width="1040" height="380" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="MCP in two directions">
<title>MCP in two directions</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="380" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">MCP · two directions: (A) built with PayPal's MCP server · (B) parked</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">MCP is a standard plug between AI apps and tools. Pyp can plug other tools in (A), and can be plugged into other AI apps (B).</text><rect x="20" y="80" width="480" height="280" rx="14" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="100" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">(A) PYP USES MCP SOURCES · BUILT</text><rect x="40" y="116" width="170" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" filter="url(#sh)"/><text x="125" y="138.9625" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal MCP server</text><text x="125" y="157.9875" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">read tools only</text><g opacity="0.55"><rect x="40" y="186" width="170" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="125" y="208.96249999999998" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">Shipping MCP</text><text x="125" y="227.98749999999998" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">later</text><rect x="40" y="256" width="170" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="125" y="278.9625" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">Storefront MCP</text><text x="125" y="297.9875" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">later</text></g><rect x="280" y="160" width="200" height="104" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="380" y="191.5625" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Case files + chat</text><text x="380" y="213.0625" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">read facts: invoices,</text>
<text x="380" y="229.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">disputes, transactions</text>
<text x="380" y="246.8125" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">(MCP read client)</text><path d="M210,142 L244,142 L244,212 L278,212" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M210,212 L244,212 L244,212 L278,212" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M210,282 L244,282 L244,212 L278,212" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="344" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start" font-style="italic">Read-only. Never a write path; writes go through the executor's REST client.</text><rect x="530" y="80" width="490" height="280" rx="14" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="544" y="100" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">(B) PYP IS AN MCP SERVER · PARKED</text><g opacity="0.55"><rect x="550" y="116" width="150" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="625" y="146.3875" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">Claude Desktop</text><rect x="550" y="186" width="150" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="625" y="216.3875" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">ChatGPT</text><rect x="550" y="256" width="150" height="52" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="625" y="286.3875" font-size="13.5" font-weight="650" fill="#1e293b" text-anchor="middle">Any MCP client</text><rect x="740" y="116" width="260" height="72" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="870" y="140" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Pyp MCP server</text><text x="870" y="161.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">tools: get_overview, run_skill,</text>
<text x="870" y="178.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">propose_action, list_cards</text><rect x="740" y="222" width="260" height="72" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="870" y="246" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Same policy engine</text><text x="870" y="267.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">actor = "mcp:&lt;client&gt;"</text>
<text x="870" y="284.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">dial + limits apply</text><path d="M700,142 L720,142 L720,152 L738,152" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M700,212 L720,212 L720,152 L738,152" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M700,282 L720,282 L720,152 L738,152" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M870,188 L870,220" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/></g><text x="550" y="344" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start" font-style="italic">Outside agents can ask; only the merchant approves.</text>
</svg>