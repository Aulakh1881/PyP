<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Two doors into Pyp">
<title>Two doors into Pyp</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Two doors into Pyp, one way out</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">Labels from PayPal are routed by code. Sentences from the merchant are routed by Claude. Both end up in the same skill pipeline.</text><rect x="20" y="80" width="400" height="170" rx="14" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="100" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">DOOR 1 · EVENTS AND THE DAILY CHECK</text><rect x="40" y="112" width="160" height="56" rx="10" fill="#eef1f5" stroke="#475569" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#sh)"/><text x="120" y="136.4375" font-size="15" font-weight="650" fill="#1e293b" text-anchor="middle">PayPal event</text><text x="120" y="157.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">DISPUTE.CREATED</text><rect x="40" y="180" width="160" height="56" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="120" y="204.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Daily check</text><text x="120" y="225.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">"invoices past due?"</text><rect x="240" y="128" width="160" height="92" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="320" y="153.5625" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Router (code)</text><text x="320" y="175.0625" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">a lookup table:</text>
<text x="320" y="191.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">label → skill</text>
<text x="320" y="208.8125" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">no AI needed</text><path d="M200,140 L220,140 L220,160 L238,160" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M200,208 L220,208 L220,188 L238,188" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="20" y="270" width="400" height="180" rx="14" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="290" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">DOOR 2 · CHAT</text><rect x="40" y="310" width="160" height="70" rx="10" fill="#e8efff" stroke="#1d4ed8" stroke-width="1.6" filter="url(#sh)"/><text x="120" y="333" font-size="15" font-weight="650" fill="#1e3a8a" text-anchor="middle">Merchant types</text><text x="120" y="354.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">"nudge Acme,</text>
<text x="120" y="371.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">but be nice"</text><rect x="240" y="300" width="160" height="92" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="320" y="325.5625" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">Chat Claude</text><text x="320" y="347.0625" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">the receptionist:</text>
<text x="320" y="363.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">understands, looks up,</text>
<text x="320" y="380.8125" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">calls runSkill(...)</text><path d="M200,345 L238,345" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><text x="40" y="430" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start" font-style="italic">Code can match labels; only Claude can read sentences.</text><rect x="470" y="80" width="550" height="370" rx="14" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="7 5"/><text x="484" y="100" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">INSIDE ONE SKILL (e.g. COLLECTIONS) · ONE RUN PER INVOICE</text><rect x="500" y="108" width="490" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="514" y="135.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="start">1  Build the case file</text><text x="514" y="156.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="start">code fetches facts from PayPal + our DB, writes XML</text><path d="M745,170 L745,190" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="500" y="192" width="490" height="62" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="514" y="219.4375" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="start">2  Claude decides</text><text x="514" y="240.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="start">what to do with THIS invoice, and writes the words → JSON</text><path d="M745,254 L745,274" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="500" y="276" width="490" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="514" y="303.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="start">3  Menu · Validator · Policy</text><text x="514" y="324.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="start">offered? still correct? allowed alone?</text><path d="M745,338 L745,358" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="500" y="360" width="490" height="62" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="514" y="387.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="start">4  Executor</text><text x="514" y="408.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="start">the only code that writes to PayPal (with a request id)</text><path d="M400,174 L450,174 L450,139 L498,139" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M400,346 L450,346 L450,139 L498,139" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>