<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Anatomy of a Pyp skill plug-in">
<title>Anatomy of a Pyp skill plug-in</title>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8496"/></marker>
  <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1040" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="750" fill="#1b2135" text-anchor="start">Anatomy of a skill (plug-in)</text><text x="24" y="56" font-size="13" font-weight="400" fill="#5b6478" text-anchor="start">A skill is one folder. The engine reads it and generates the prompt, the response schema and the checks. Adding a skill never changes the engine.</text><rect x="20" y="76" width="420" height="420" rx="14" fill="none" stroke="#0f766e" stroke-width="1.4" stroke-dasharray="7 5"/><text x="34" y="96" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="start">skills/collections/</text><rect x="36" y="104" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="126" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">skill.ts</text><text x="50" y="144" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">id, triggers (events + sweeps), model, effort, default dial</text><rect x="36" y="168" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="190" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">case-file.ts</text><text x="50" y="208" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">fetch facts from PayPal + DB → XML with ids</text><rect x="36" y="232" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="254" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">commands/*.ts</text><text x="50" y="272" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">one file per command: params schema, prompt rule, check, execute</text><rect x="36" y="296" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="318" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">prompt.md</text><text x="50" y="336" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">role, playbook, tone guide (cached)</text><rect x="36" y="360" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="382" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">policy.ts</text><text x="50" y="400" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">default limits; which commands can never be Auto</text><rect x="36" y="424" width="388" height="52" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="50" y="446" font-size="13.5" font-weight="700" fill="#134e4a" text-anchor="start">evals/*.xml</text><text x="50" y="464" font-size="12" font-weight="400" fill="#5b6478" text-anchor="start">golden case files + expected commands</text><rect x="520" y="96" width="220" height="70" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="630" y="119" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Skill registry</text><text x="630" y="140.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">skills = [collections,</text>
<text x="630" y="157.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">disputes, insights, …]</text><rect x="800" y="96" width="220" height="70" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="910" y="119" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Command catalog</text><text x="910" y="140.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">filtered per case by</text>
<text x="910" y="157.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">dial, state, permissions</text><rect x="520" y="214" width="220" height="82" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="630" y="243" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Prompt builder</text><text x="630" y="264.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">cached system prompt</text>
<text x="630" y="281.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">+ &lt;case-file&gt; + &lt;commands&gt;</text><rect x="800" y="214" width="220" height="82" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="910" y="243" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Schema builder</text><text x="910" y="264.5" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">anyOf per allowed command,</text>
<text x="910" y="281.375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">real ids as enums</text><rect x="660" y="340" width="220" height="70" rx="10" fill="#f3edff" stroke="#6d28d9" stroke-width="1.6" filter="url(#sh)"/><text x="770" y="371.4375" font-size="15" font-weight="650" fill="#4c1d95" text-anchor="middle">One structured call</text><text x="770" y="392.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">returns summary + actions[]</text><rect x="520" y="440" width="200" height="52" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="620" y="462.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Validator</text><text x="620" y="483.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">command.check()</text><rect x="820" y="440" width="200" height="52" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.6" filter="url(#sh)"/><text x="920" y="462.4375" font-size="15" font-weight="650" fill="#134e4a" text-anchor="middle">Executor</text><text x="920" y="483.9375" font-size="12.5" font-weight="400" fill="#5b6478" text-anchor="middle">command.execute()</text><path d="M440,131 L518,131" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="442.76" y="110" width="70.48" height="19.6" rx="4" fill="#ffffff" opacity="0.92"/><text x="478" y="122" font-size="12" font-weight="400" fill="#5b6478" text-anchor="middle">registers</text><path d="M740,131 L798,131" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M630,166 L630,212" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M910,166 L910,212" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M630,296 L630,375 L658,375" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M910,296 L910,375 L882,375" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M770,410 L770,425 L630,425 L630,438" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><path d="M720,466 L818,466" fill="none" stroke="#7b8496" stroke-width="1.6" marker-end="url(#ah)"/><rect x="727.04" y="447" width="83.92" height="18.3" rx="4" fill="#ffffff" opacity="0.92"/><text x="769" y="458" font-size="11" font-weight="400" fill="#5b6478" text-anchor="middle">after policy</text>
</svg>